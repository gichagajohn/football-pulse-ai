name: Football Pulse AI Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the DB back to the repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Create .env file
        run: |
          echo "FOOTBALL_DATA_API_KEY=${{ secrets.FOOTBALL_DATA_API_KEY }}" >> .env
          echo "FB_PAGE_ACCESS_TOKEN=${{ secrets.FB_PAGE_ACCESS_TOKEN }}" >> .env
          echo "FB_PAGE_ID=${{ secrets.FB_PAGE_ID }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "MIN_PRIORITY_TO_POST=40" >> .env
          echo "MAX_POSTS_PER_HOUR=8" >> .env
          echo "DEDUPE_WINDOW_HOURS=6" >> .env
          echo "TIMEZONE=Africa/Nairobi" >> .env
      - name: Run bot cycle
        run: python run_once.py
      - name: Save database state back to repo
        if: always()   # run even if the bot cycle had errors
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "*.db" database/*.db 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "chore: persist bot state [skip ci]"
            git push
          fi
